<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <meta name="description" content="A fun interactive page made with love by Reymart Villacampa Cadalso.">
  <meta name="author" content="Reymart Villacampa Cadalso">
  <meta name="robots" content="index,follow">

  <!-- Google AdSense Verification Meta Tag -->
  <meta name="google-adsense-account" content="ca-pub-8309769369347508">

  <!-- Google AdSense Script -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8309769369347508"
    crossorigin="anonymous"></script>

  <title>Click Me, Reymart!</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg1: #111827;
      --bg2: #312e81;
      --pink: #fb7185;
      --purple: #a78bfa;
      --white: #f9fafb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 15% 15%, rgba(251,113,133,.25), transparent 32%),
        radial-gradient(circle at 85% 85%, rgba(167,139,250,.25), transparent 35%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    .card {
      width: min(100%, 430px);
      padding: 34px 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 28px;
      background: rgba(17,24,39,.88);
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
      animation: appear .7s ease both;
    }

    .emoji { font-size: 54px; margin-bottom: 8px; }

    .eyebrow {
      margin: 0 0 8px;
      color: #c4b5fd;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 7vw, 2.5rem);
      line-height: 1.12;
    }

    .name { color: var(--pink); }

    .intro {
      color: #d1d5db;
      line-height: 1.6;
      margin: 16px 0 24px;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(.98); }

    button:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    .primary {
      color: #1f1235;
      background: linear-gradient(100deg, #fda4af, #c4b5fd);
      box-shadow: 0 8px 24px rgba(167,139,250,.22);
    }

    .question {
      display: none;
      margin-top: 26px;
      animation: appear .4s ease both;
    }

    .question.show { display: block; }

    .question h2 {
      font-size: 1.45rem;
      margin: 0 0 8px;
    }

    .question p {
      color: #d1d5db;
      margin: 0 0 18px;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .yes { color: #052e16; background: #86efac; }
    .no { color: #fff; background: #f87171; }

    .hint {
      font-size: .78rem;
      color: #9ca3af;
      margin-top: 20px;
    }

    .heart {
      display: inline-block;
      animation: pulse 1.2s infinite;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      50% { transform: scale(1.18); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="emoji" aria-hidden="true">😎</div>

    <p class="eyebrow">A tiny question for you</p>

    <h1>
      Click Me,
      <span class="name">Reymart Villacampa Cadalso!</span>
    </h1>

    <p class="intro">
      May itatanong lang ako sa'yo. Ready ka na ba? 👀
    </p>

    <button class="primary" id="startBtn" type="button">
      ✨ Click Me!
    </button>

    <section class="question" id="question" aria-live="polite">
      <h2>Pogi ba ako? 😏</h2>
      <p>Choose your answer… pero may surprise pa rin! 😂</p>

      <div class="answers">
        <button class="yes" type="button" data-answer="Oo">
          Oo 😍
        </button>

        <button class="no" type="button" data-answer="Hindi">
          Hindi 😂
        </button>
      </div>
    </section>

    <p class="hint">
      Made with <span class="heart">💗</span> by Reymart
    </p>
  </main>

  <script>
    const DOWNLOAD_LINK =
      "https://www.mediafire.com/file/6his4b9kkfd31te/KSWEB_4.06_93_67862d.apk/file";

    const startBtn = document.getElementById("startBtn");
    const question = document.getElementById("question");

    startBtn.addEventListener("click", function () {
      question.classList.add("show");
      startBtn.textContent = "😏 Now answer me!";
      startBtn.disabled = true;
      startBtn.style.opacity = "0.8";
    });

    document.querySelectorAll("[data-answer]").forEach(function (button) {
      button.addEventListener("click", function () {
        window.location.href = DOWNLOAD_LINK;
      });
    });
  </script>
</body>
</html>
